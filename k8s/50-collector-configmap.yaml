apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: lgtm
  labels:
    app: otel-collector
data:
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 200
        spike_limit_mib: 50
      filter/kubo_dht:
        error_mode: ignore
        traces:
          span:
            - 'IsMatch(name, "^KademliaDHT\\.")'
      batch: {}

    # The image is distroless, so kubelet cannot exec a shell to test the
    # process. This endpoint is the only thing a probe can talk to.
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    exporters:
      debug:
        verbosity: basic
      otlp_grpc/tempo:
        endpoint: tempo.lgtm.svc.cluster.local:4317
        tls:
          insecure: true
      prometheus_remote_write:
        endpoint: http://prometheus.lgtm.svc.cluster.local:9090/api/v1/write
      otlp_http/loki:
        endpoint: http://loki.lgtm.svc.cluster.local:3100/otlp

    service:
      extensions: [health_check]
      telemetry:
        logs:
          level: info
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, filter/kubo_dht, batch]
          exporters: [debug, otlp_grpc/tempo]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug, prometheus_remote_write]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug, otlp_http/loki]
