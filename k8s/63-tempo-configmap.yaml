apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  namespace: lgtm
data:
  tempo.yaml: |
    server:
      http_listen_port: 3200

    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317

    live_store:
      max_block_duration: 5m

    backend_scheduler:
      provider:
        compaction:
          compaction:
            block_retention: 6h

    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/blocks
        wal:
          path: /var/tempo/wal
